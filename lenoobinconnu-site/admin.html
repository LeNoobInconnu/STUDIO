<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espace administrateur - LeNoobInconnu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Syne:wght@800&display=swap">
<link rel="stylesheet" href="style.css">
<style>
/* Mise en page de l'espace admin : n'utilise que les couleurs et polices du site (style.css) */
.adm { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 100vh; background: var(--bg); color: var(--fg); }
.adm-side { background: var(--ink); color: #fff; padding: 22px 14px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.adm-brand { display: grid; gap: 2px; padding: 4px 10px 22px; text-decoration: none; color: var(--yellow); }
.adm-brand strong { font-family: var(--font-head); font-size: 1.5rem; text-transform: uppercase; line-height: 1; }
.adm-brand span { font-family: var(--font-mono); font-size: .62rem; letter-spacing: .2em; color: #e8892b; text-transform: uppercase; }
.adm-nav { display: grid; gap: 4px; }
.adm-nav a, .adm-nav button { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 10px; color: #fff; text-decoration: none; font: 600 .95rem var(--font-body); background: transparent; border: 0; cursor: pointer; text-align: left; }
.adm-nav a:hover, .adm-nav button:hover { background: rgba(255,255,255,.08); }
.adm-nav a[aria-current="page"] { background: var(--red); }
.adm-nav svg { width: 20px; height: 20px; flex: none; }
.adm-deco { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 10px; color: #fff; cursor: pointer; font: 600 .95rem var(--font-body); background: transparent; border: 0; text-align: left; }
.adm-deco:hover { background: rgba(255,255,255,.08); }
.adm-deco svg { width: 20px; height: 20px; }
.adm-pied { margin-top: auto; display: grid; gap: 12px; padding-top: 22px; border-top: 1px solid var(--line-dark); }
.adm-qui { display: flex; align-items: center; gap: 10px; padding: 0 6px; min-width: 0; }
.adm-qui img, .adm-qui .ini { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex: none; }
.adm-qui .ini { display: grid; place-items: center; background: var(--red); font-weight: 700; }
.adm-qui strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.adm-qui small { font-family: var(--font-mono); font-size: .62rem; letter-spacing: .14em; text-transform: uppercase; color: #9aa0ab; }
.adm-main { min-width: 0; }
.adm-top { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 16px 28px; background: var(--surface); border-bottom: 1px solid var(--line); }
.adm-search { flex: 1 1 280px; max-width: 480px; display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; background: var(--bg); }
.adm-search svg { width: 18px; height: 18px; color: var(--gray); flex: none; }
.adm-search input { flex: 1; border: 0; background: transparent; color: var(--fg); font: 1rem var(--font-body); padding: 11px 0; min-width: 0; }
.adm-search input:focus { outline: none; }
.adm-search:focus-within { outline: 3px solid var(--red); outline-offset: 2px; }
.adm-lien { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; color: var(--fg); text-decoration: none; font-weight: 600; font-size: .9rem; background: var(--surface); }
.adm-lien:hover { border-color: var(--red); color: var(--red); }
.adm-body { padding: 24px 28px 40px; display: grid; gap: 18px; }
.adm-banner { background: var(--ink); color: #fff; border-radius: 18px; padding: 26px 28px; display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; border-bottom: 4px solid var(--red); }
.adm-banner h1 { margin: 0; font-family: var(--font-head); text-transform: uppercase; font-size: clamp(2rem, 4vw, 2.8rem); line-height: .95; }
.adm-banner h1 span { color: var(--yellow); }
.adm-banner p { margin: 8px 0 0; color: #c9ccd3; max-width: 60ch; }
.adm-date { font-family: var(--font-mono); font-size: .75rem; letter-spacing: .08em; color: #c9ccd3; text-align: right; }
.adm-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.adm-stat { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; gap: 14px; align-items: center; }
.adm-ico { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; background: var(--ink); color: var(--yellow); flex: none; }
.adm-ico svg { width: 24px; height: 24px; }
.adm-stat b { display: block; font-family: var(--font-display); font-size: 1.9rem; line-height: 1; }
.adm-stat small { font-size: .85rem; color: var(--text-soft); }
.adm-section { display: grid; gap: 14px; }
.adm-section-heading h2 { margin: 0; font: 700 1.5rem/1 var(--font-head); text-transform: uppercase; }
.adm-section-heading p { margin: 6px 0 0; color: var(--text-soft); }
.adm-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px; align-items: stretch; }
.adm-tool-grid { grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); }
.adm-widget-tools { display: flex; justify-content: flex-end; }
.adm-widget-tools button, .adm-widget-actions button { min-height: 38px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg); font: 600 .9rem var(--font-body); cursor: pointer; }
.adm-widget-tools button:hover, .adm-widget-actions button:hover { border-color: var(--red); color: var(--red); }
.adm-widget-panel { display: grid; gap: 12px; padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.adm-widget-panel[hidden] { display: none; }
.adm-widget-panel p { margin: 0; color: var(--text-soft); }
.adm-widget-options { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px 14px; }
.adm-widget-options label { display: flex; align-items: center; gap: 9px; font-size: .9rem; }
.adm-widget-options input { accent-color: var(--red); }
.adm-widget-actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.adm-widget-grid { --widget-gap: 16px; position: relative; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--widget-gap); align-items: stretch; }
.adm-widget-grid.is-editing { background-image: repeating-linear-gradient(to right, rgba(128,128,128,.1) 0 1px, transparent 1px calc((100% + 176px) / 12)); border-radius: 12px; }
.adm-widget-grid > .adm-widget { grid-column: span 4; min-width: 0; }
.adm-widget-grid > .adm-card.adm-widget.large[data-widget-size="wide"] { grid-column: span 8; }
.adm-widget-grid > .adm-widget[data-widget-size="wide"]:not(.large) { grid-column: span 6; }
.adm-widget-grid > .adm-widget.adm-stat { grid-column: span 3; }
.adm-widget-grid > .adm-widget[hidden] { display: none !important; }
.adm-widget-handle { display: none; margin-left: auto; padding: 6px 9px; border: 1px dashed var(--line); border-radius: 8px; background: var(--bg); color: var(--text-soft); font: 600 .72rem var(--font-body); cursor: grab; }
.adm-widget-grid.is-editing .adm-widget-handle { display: inline-flex; align-items: center; }
.adm-widget-grid.is-editing > .adm-widget { outline: 1px dashed var(--line); outline-offset: 3px; }
.adm-widget-grid > .adm-widget.is-dragging { opacity: .45; }
.adm-widget-title { display: flex; align-items: center; gap: 10px; }
.adm-widget-title h2, .adm-widget-title h3 { flex: 1; min-width: 0; }
.adm-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: grid; gap: 14px; align-content: start; }
.adm-card.large { grid-column: 1 / -1; }
.adm-card h2 { margin: 0; font-family: var(--font-head); text-transform: uppercase; font-size: 1.35rem; line-height: 1; display: flex; gap: 10px; align-items: center; }
.adm-card h2 svg { width: 22px; height: 22px; color: var(--red); flex: none; }
.adm-card h3 { margin: 0; font: 700 1.2rem/1.1 var(--font-head); text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
.adm-card h3 svg { width: 22px; height: 22px; color: var(--red); flex: none; }
.adm-card h2 a { margin-left: auto; font-family: var(--font-body); text-transform: none; font-size: .85rem; font-weight: 600; color: var(--red); text-decoration: none; }
.adm-card > p { margin: 0; color: var(--text-soft); font-size: .92rem; }
/* Tool cards : hauteur uniforme, 3 zones empilées */
.adm-tool-card { min-height: 0; display: grid; grid-template-rows: auto 1fr auto; gap: 14px; }
.adm-tool-head { display: flex; align-items: center; gap: 12px; }
.adm-tool-ico { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--ink); color: var(--yellow); flex: none; }
.adm-tool-ico svg { width: 22px; height: 22px; }
.adm-tool-card h3 { margin: 0; }
.adm-tool-desc { margin: 0; color: var(--text-soft); font-size: .9rem; }
.adm-tool-footer { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; border-top: 1px solid var(--line); padding-top: 12px; }
.adm-tool-footer .adm-action { flex: 1 1 auto; }
/* Boutons rapides sur le dashboard */
.adm-quick { padding: 8px 11px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--fg); font: 600 .78rem var(--font-body); cursor: pointer; white-space: nowrap; line-height: 1; }
.adm-quick:hover { border-color: var(--red); color: var(--red); }
.adm-action { margin-top: 0; display: inline-flex; align-items: center; justify-content: center; min-height: 38px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--fg); text-decoration: none; font-weight: 600; }
.adm-action:hover { border-color: var(--red); color: var(--red); }
.adm-champ { display: grid; gap: 6px; font-family: var(--font-mono); font-size: .66rem; letter-spacing: .16em; text-transform: uppercase; color: var(--gray); }
.adm-champ input, .adm-champ textarea, .adm-champ select { font: 1rem var(--font-body); letter-spacing: 0; text-transform: none; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; width: 100%; }
.adm-champ textarea { resize: vertical; }
.adm-liste { list-style: none; margin: 0; padding: 0; display: grid; }
.adm-liste li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.adm-liste li:first-child { border-top: 0; }
.adm-liste .av { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; background: var(--line); display: block; }
.adm-liste .txt { min-width: 0; }
.adm-liste .txt strong { display: block; }
.adm-liste .txt span { display: block; font-size: .88rem; color: var(--text-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.adm-liste time { font-family: var(--font-mono); font-size: .66rem; letter-spacing: .06em; color: var(--gray); white-space: nowrap; }
.adm-ligne-type { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--ink); color: var(--yellow); }
.adm-ligne-type svg { width: 18px; height: 18px; }
.adm-barres { display: grid; gap: 12px; }
.adm-barres div { display: grid; grid-template-columns: 130px minmax(0, 1fr) 56px; gap: 12px; align-items: center; font-size: .9rem; }
.adm-barres .piste { height: 12px; background: var(--line); border-radius: 999px; overflow: hidden; }
.adm-barres .piste span { display: block; height: 100%; background: var(--red); border-radius: 999px; }
.adm-barres b { font-family: var(--font-mono); font-size: .8rem; text-align: right; }
.adm-msg { margin: 0; padding: 10px 14px; border-radius: 10px; font-weight: 600; font-size: .9rem; }
.adm-msg.ok { background: #e6f6ea; color: #17633a; }
.adm-msg.err { background: #fde8e8; color: #9b1c1c; }
html[data-theme="dark"] .adm-msg.ok { background: #173524; color: #9ae6b4; }
html[data-theme="dark"] .adm-msg.err { background: #3a1717; color: #feb2b2; }
.adm-vide { padding: 30px; text-align: center; display: grid; gap: 14px; justify-items: center; }
.adm-vide[hidden] { display: none; }
.adm-filtre[hidden] { display: none; }
@media (max-width: 860px) {
  .adm { grid-template-columns: minmax(0, 1fr); }
  .adm-side { position: static; height: auto; }
  .adm-nav { grid-auto-flow: column; grid-auto-columns: max-content; overflow-x: auto; }
  .adm-top, .adm-body { padding-inline: 16px; }
  .adm-banner { padding: 20px; }
  .adm-date { text-align: left; }
  .adm-widget-grid > .adm-widget, .adm-widget-grid > .adm-widget[data-widget-size="wide"] { grid-column: span 6; }
  .adm-widget-grid > .adm-card.adm-widget.large[data-widget-size="wide"] { grid-column: span 6; }
}
@media (max-width: 560px) {
  .adm-widget-grid > .adm-widget, .adm-widget-grid > .adm-widget[data-widget-size="wide"], .adm-widget-grid > .adm-widget.adm-stat { grid-column: 1 / -1; }
}
</style>
</head>
