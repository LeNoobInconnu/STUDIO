<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Mise à jour de l'application</title>

<style>
  :root {
    --paper: #e9edf2;
    --surface: #f7f9fb;
    --ink: #16213a;
    --muted: #55607a;
    --signal: #d4f03c;
    --signal-ink: #16213a;

    box-sizing: border-box;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0d1324;
      --surface: #151d33;
      --ink: #e8ecf5;
      --muted: #97a3bd;
    }
  }

  *, *::before, *::after {
    box-sizing: inherit;
  }

  html {
    height: 100%;
  }

  body {
    margin: 0;
    min-height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: "Avenir Next", "Segoe UI Variable", "Segoe UI",
      system-ui, -apple-system, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 25px;
  }

  main {
    width: 100%;
    max-width: 600px;
  }

  h1 {
    font-size: 1.05rem;
    font-weight: 600;
    margin: 0 0 2rem;
    color: var(--muted);
  }

  h1 strong {
    color: var(--ink);
  }

  .versions {
    display: grid;
    grid-template-columns: 1fr 1fr;

    border: 1.5px solid var(--ink);
    border-radius: 14px;
    overflow: hidden;

    background: var(--surface);
  }

  .version {
    padding: 1.25rem 1.4rem 1.5rem;
  }

  .version + .version {
    background: var(--ink);
    color: var(--paper);
  }

  .label {
    font-size: 0.9rem;
    margin: 0 0 0.35rem;
    opacity: 0.75;
  }

  .number {
    font-size: clamp(1.9rem, 8vw, 3.1rem);
    font-weight: 700;
    margin: 0;
  }

  .status {
    margin: 1.6rem 0;
    font-size: 1.15rem;
    font-weight: 600;
  }

  .actions {
    display: flex;
  }

  .btn {
    width: 100%;

    font: inherit;
    font-weight: 700;

    cursor: pointer;

    border-radius: 12px;
    padding: 1rem 1.3rem;

    border: 1.5px solid var(--ink);

    background: var(--signal);
    color: var(--signal-ink);

    text-decoration: none;
    text-align: center;

    transition: transform 0.15s ease;
  }

  .btn:active {
    transform: scale(0.97);
  }

  @media (max-width: 480px) {
    .versions {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>

<body>

<main>

  <h1>
    Mise à jour de <strong>LeNoobInconnu STUDIO</strong>
  </h1>

  <section class="versions">

    <div class="version">
      <p class="label">Installée</p>
      <p class="number">0.0.0</p>
    </div>

    <div class="version">
      <p class="label">Disponible</p>
      <p class="number">1.0.0</p>
    </div>

  </section>

  <p class="status">
    Une mise à jour est disponible.
  </p>

  <div class="actions">

    <a
      class="btn"
      href="http://lenoobinconnu.github.io/STUDIO/mon-app.apk"
    >
      Installer
    </a>

  </div>

</main>

</body>
</html>
